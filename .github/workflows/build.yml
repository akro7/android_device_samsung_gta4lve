name: Build EKOFLASH EXE

on:
  push:
    branches: [ "android-12.1", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Verify Assets Existence
        run: |
          if (Test-Path "ekoflash.py") { echo "Script found!" } else { exit 1 }
          if (Test-Path "fastboot.exe") { echo "Fastboot engine found!" } else { exit 1 }
          if (Test-Path "heimdall.exe") { echo "Heimdall engine found!" } else { echo "Heimdall missing!"; exit 1 }

      - name: Build EXE with All Engines (Fastboot & Odin)
        # تم إضافة heimdall.exe لضمان تفعيل واجهة سامسونج
        run: |
          python -m PyInstaller --noconsole --onefile --icon="icon.ico" `
          --add-data "fastboot.exe;." `
          --add-data "adb.exe;." `
          --add-data "AdbWinApi.dll;." `
          --add-data "AdbWinUsbApi.dll;." `
          --add-data "heimdall.exe;." `
          --name "EKOFLASH_PRO_v2.1" ekoflash.py

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: EKOFLASH_OUTPUT
          path: dist/EKOFLASH_PRO_v2.1.exe
