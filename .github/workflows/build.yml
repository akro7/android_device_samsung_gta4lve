name: Build EKOFLASH EXE

on:
  push:
    branches: [ "android-12.1", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Verify Assets Existence
        # تأكدنا هنا من وجود السكريبت والأيقونة معاً
        run: |
          if (Test-Path "ekoflash.py") { echo "Script found!" } else { echo "Error: ekoflash.py missing!"; exit 1 }
          if (Test-Path "icon.ico") { echo "Icon found!" } else { echo "Warning: icon.ico not found, build will continue without it." }

      - name: Build EXE with Icon
        # أضفنا --icon="icon.ico" لدمج شعار الفينيكس داخل ملف الـ EXE
        run: |
          python -m PyInstaller --noconsole --onefile --icon="icon.ico" --name "EKOFLASH_PRO_v2.0_AKRO" ekoflash.py

      - name: Upload Result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EKOFLASH_PRO_Windows
          path: dist/EKOFLASH_PRO_v2.0_AKRO.exe
