name: Build EKOFLASH EXE

on:
  push:
    branches: [ "android-12.1", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Verify Script Existence
        # الخطوة دي عشان نتأكد إن الملف موجود فعلاً قبل ما نبدأ
        run: |
          if (Test-Path "ekoflash.py") { echo "File found!" } else { echo "Error: ekoflash.py not found!"; exit 1 }

      - name: Build EXE (No Console Mode)
        # استخدمنا python -m PyInstaller لضمان النداء الصحيح في بيئة CI
        run: |
          python -m PyInstaller --noconsole --onefile --name "EKOFLASH_PRO_v2.0" ekoflash.py

      - name: Upload Result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EKOFLASH_Windows_App
          path: dist/EKOFLASH_PRO_v2.0.exe
